services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appnation
      POSTGRES_PASSWORD: appnation_dev
      POSTGRES_DB: ai_chat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appnation -d ai_chat"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://appnation:appnation_dev@db:5432/ai_chat?schema=public
      JWT_SECRET: appnation-production-secret
      PORT: 3000
      # Set OPENAI_API_KEY here for real AI; leave unset or set MOCK_AI=true for demo mode
      MOCK_AI: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./feature-flags.json:/app/feature-flags.json

volumes:
  pgdata:
